# Slack app manifest for the FYRK bot (runtime/src/slack-bot/).
# Create the app at https://api.slack.com/apps → "Create New App" → "From an app manifest", paste this file,
# install it to the workspace, then set SLACK_FYRK_BOT_TOKEN (Bot User OAuth Token) and
# SLACK_FYRK_SIGNING_SECRET (Basic Information → Signing Secret) as Fly secrets.
# The request URL is verified by Slack once the runtime with those secrets is deployed.
display_information:
  name: FYRK
  description: Svarer på spørsmål i FYRK-workspacet. Første modul er personalhåndboka for Kvitsøy kommune.
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: FYRK
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - im:history
      - channels:history
      - groups:history
settings:
  event_subscriptions:
    request_url: https://fyrk-agent-runtime.fly.dev/slack/fyrk-bot-events
    bot_events:
      - app_mention
      - message.im
      - message.channels
      - message.groups
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
