<script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"projects":[{"id":3556,"documentId":"lod9hebno16kly9t8j7fdj0e","locale":"en","createdAt":"2026-09-23T11:58:31.637Z","updatedAt":"2026-09-23T11:58:47.921Z","publishedAt":"2026-09-23T11:58:47.909Z","title":"Consultant Request – Lead ERP S/4HANA Migration Technical Architect-Oslo","slug":"consultant-request-lead-erp-s-4-hana-migration-technical-architect-oslo","description":"<p><span lang=\"EN-US\"><strong>Location:</strong> Oslo area (hybrid)</span><br><span lang=\"EN-US\"><strong>Start Date:</strong> ASAP / By Agreement</span><br><span lang=\"EN-US\"><strong>Duration:</strong> Long-term assignment (12+ months)</span><br><span lang=\"EN-US\"><strong>Allocation:</strong> 100%</span><br><span lang=\"EN-US\"><strong>Seniority:</strong> Senior / Lead Architect</span></p><p><span lang=\"EN-US\"><strong>Assignment Overview</strong></span></p><p>Our client is undertaking a large-scale SAP S/4HANA transformation and is looking for an experienced Lead ERP S/4HANA Migration Technical Architect to drive the technical architecture and migration strategy.</p><p>The consultant will play a key role in defining the target architecture, leading migration activities, governing technical workstreams, and ensuring a successful transition from the current SAP landscape to SAP S/4HANA.</p><p>This position requires close collaboration with business stakeholders, enterprise architects, development teams, infrastructure specialists, and external partners.</p><p>Key Responsibilities</p><ul><li data-list-item-id=\"e8a4fadd742ae626828391f36bbb5fff3\">S/4HANA Migration Strategy &amp; Architecture</li><li data-list-item-id=\"efa909c9c89fdaffea59cc362cdad30d7\">Define the target architecture for the SAP S/4HANA program.</li><li data-list-item-id=\"e6cb6a86c31cccf5ad652807cb5c9f767\">Develop migration roadmaps and technical design principles.</li><li data-list-item-id=\"ef49dff5699104201c6d68539fcf1d18d\">Ensure alignment with enterprise architecture, security, and compliance requirements.</li><li data-list-item-id=\"e80c0857d8e8cceebd8ae5dd7e1b204b2\">Identify risks and mitigation strategies related to the migration.</li></ul><p>Technical Leadership</p><ul><li data-list-item-id=\"ee93bb5c56327c253a09b31b29bc3fc38\">Lead technical workstreams throughout the transformation program.</li><li data-list-item-id=\"e1569a646e050270ae3c15e3f77fb558d\">Provide expert guidance across SAP Basis, HANA, ABAP, Fiori, integrations, and security.</li><li data-list-item-id=\"e1018ec7c3455aaef3ee06120ff164560\">Review and approve solution designs, migration approaches, and implementation plans.</li><li data-list-item-id=\"e8391eb4e8bb17a7839a8ae895d505543\">Establish technical governance, standards, and best practices.</li></ul><p>Integration Architecture</p><ul><li data-list-item-id=\"ef2fb3c795e3c79853a9182f36bbc6f06\">Assess the impact of the S/4HANA transformation on existing integrations and third-party systems.</li><li data-list-item-id=\"e0de0e9b5ee6a6039795ded769e409efc\">Define integration strategies and target-state architecture.</li><li data-list-item-id=\"ec29c933c240f1b95493ee1334ba3cc33\">Ensure business-critical interfaces are successfully migrated and tested.</li><li data-list-item-id=\"e40caa5d0ef12ce421cfeda9060fb2ef1\">Support integration testing, cutover planning, and deployment activities.</li></ul><p>Technical Migration &amp; Conversion</p><ul><li data-list-item-id=\"edfec9e2f620c16b51a23a57b6f5467eb\"><p style=\"tab-stops:list 36.0pt;\">Lead custom code assessments and remediation activities.</p></li><li data-list-item-id=\"e6c0589236947a9903ac7f9ca43239782\"><p style=\"tab-stops:list 36.0pt;\">Support technical conversion planning and execution.</p></li><li data-list-item-id=\"e07922af55ae5a39da7e4be176b1c7384\"><p style=\"tab-stops:list 36.0pt;\">Drive activities related to system readiness, performance optimization, and downtime minimization.</p></li><li data-list-item-id=\"e5fe481c737bc0361670ca257c3edfe65\"><p style=\"tab-stops:list 36.0pt;\">Provide guidance on migration tools, methodologies, and best practices.</p></li></ul><p>Platform &amp; Environment Management</p><ul><li data-list-item-id=\"e38f160c2b1bec3899020e9eb6bf2ef75\"><p style=\"tab-stops:list 36.0pt;\">Design secure, scalable, and high-availability SAP environments.</p></li><li data-list-item-id=\"e3869cfaf67c1814b6afbfcfc9a08e353\"><p style=\"tab-stops:list 36.0pt;\">Collaborate with infrastructure, cloud, and security teams.</p></li><li data-list-item-id=\"e425346119722003d40603b63a7a3594a\"><p style=\"tab-stops:list 36.0pt;\">Support transport management, release management, environment strategy, and deployment processes.</p></li></ul><p>Required Qualifications</p><ul><li data-list-item-id=\"e38e90cec3b3a089d91ad328a878d4f89\"><p style=\"tab-stops:list 36.0pt;\">Minimum 10 years of SAP experience.</p></li><li data-list-item-id=\"e609a5c4f7c4016cce2b791ebfeb1662c\"><p style=\"tab-stops:list 36.0pt;\">Minimum 5 years of experience with SAP S/4HANA transformation programs.</p></li><li data-list-item-id=\"e667f0679f13409b6eb02bcd55728ee78\"><p style=\"tab-stops:list 36.0pt;\">Proven experience as a Technical Architect or Lead Architect in large-scale ERP transformation initiatives.</p></li><li data-list-item-id=\"e5edf3dda825bdacd172d376edc370580\"><p style=\"tab-stops:list 36.0pt;\">Strong expertise in:&nbsp;</p></li><li data-list-item-id=\"e7765c891c293d0d417a3aa4760736581\"><p style=\"tab-stops:list 72.0pt;\">SAP S/4HANA</p></li><li data-list-item-id=\"eddee5a09266c9040e4391a763b30b582\"><p style=\"tab-stops:list 72.0pt;\">SAP Basis</p></li><li data-list-item-id=\"ef84fd1ef1c9044016c0e4bf3b29d2795\"><p style=\"tab-stops:list 72.0pt;\">SAP HANA</p></li><li data-list-item-id=\"e12661bfc2ab91927eae278a14e4668dc\"><p style=\"tab-stops:list 72.0pt;\">SAP ABAP</p></li><li data-list-item-id=\"ed7e8f35db1db784ea58d1da6238d4453\"><p style=\"tab-stops:list 72.0pt;\">SAP Fiori</p></li><li data-list-item-id=\"e98cb27b60b8d36cc4fdbda4b7dacdb62\"><p style=\"tab-stops:list 72.0pt;\">SAP Integration Technologies</p></li><li data-list-item-id=\"ed08bc7dfcd7d02fff2b6ced5b5f6970b\"><p style=\"tab-stops:list 72.0pt;\">Microsoft Azure or comparable cloud platforms</p></li><li data-list-item-id=\"e0d76a2f2722a6f83abef549c70d8c203\"><p style=\"tab-stops:list 36.0pt;\">Experience with enterprise architecture, technical governance, and stakeholder management.</p></li><li data-list-item-id=\"e6f1a302de2cbb4208b797361c8b9768d\"><p style=\"tab-stops:list 36.0pt;\">Excellent communication and leadership skills.</p></li></ul><p>Preferred Qualifications</p><ul><li data-list-item-id=\"ed77948bab048c0f9da7b6c5a4e43994d\"><p style=\"tab-stops:list 36.0pt;\">Experience from large international transformation programs.</p></li><li data-list-item-id=\"ece8dd411e03443f4a22e62c4047130ee\"><p style=\"tab-stops:list 36.0pt;\">Experience with Brownfield migrations.</p></li><li data-list-item-id=\"e483346db9c896dbcc1f1eea5de3e1756\"><p style=\"tab-stops:list 36.0pt;\">Strong understanding of SAP custom code migration and modernization.</p></li><li data-list-item-id=\"e52a04df33975ac756c887c03854aa17b\"><p style=\"tab-stops:list 36.0pt;\">Experience with SAP Readiness Check, ATC, and migration planning activities.</p></li><li data-list-item-id=\"e5805451b521b540bcda1c738f37315d5\"><p style=\"tab-stops:list 36.0pt;\">Knowledge of Clean Core principles and SAP extensibility frameworks.</p></li><li data-list-item-id=\"ee87bb8299e98b8ece1779ef2d89943c7\"><p style=\"tab-stops:list 36.0pt;\">Deliverables Requested</p></li></ul><p>Please submit:</p><ul><li data-list-item-id=\"e7fef581934ac32db87426a5bb4b2c31b\"><p style=\"tab-stops:list 36.0pt;\">Updated CV (Word format preferred).</p></li><li data-list-item-id=\"e80b1b89b2253674c04cfcfc506fde019\"><p style=\"tab-stops:list 36.0pt;\">Short description of relevant SAP S/4HANA migration projects.</p></li><li data-list-item-id=\"e22659173c732e4b71756a8f328a3db21\"><p style=\"tab-stops:list 36.0pt;\">Availability/start date.</p></li><li data-list-item-id=\"e63c6b68124a47cabb0b354b92aacb147\"><p style=\"tab-stops:list 36.0pt;\">Hourly rate (EUR or NOK, excluding VAT).</p></li><li data-list-item-id=\"e3b39b47f851bc9869bb81fc5b77aa84b\"><p style=\"tab-stops:list 36.0pt;\">Current location and willingness to travel if required.</p></li></ul><p>We will review candidates on an ongoing basis and are particularly interested in profiles with proven experience delivering complex SAP S/4HANA transformation and migration programs.</p><p><strong>Interesting - </strong><a href=\"mailto:rune.rasen@rightpeoplegroup.com\"><strong>rune.rasen@rightpeoplegroup.com</strong></a><strong>.&nbsp;</strong></p>","location":"Norway","languages":"English","competences":"ERP, CRM and CMS","open":true},{"id":3552,"documentId":"bl53apw4tlcijm4fj0kn6jr9","locale":"en","createdAt":"2026-09-14T08:00:10.139Z","updatedAt":"2026-09-14T08:09:07.095Z","publishedAt":"2026-09-14T08:09:07.069Z","title":"Consultant Task – D365, Azure, Data & Digital Transformation (2026.09.14)","slug":"consultant-task-d365-azure-data-and-digital-transformation","description":"<h1><span class=\"s1\"><strong>Consultant Assignments – D365, Azure, Data &amp; Digital Transformation</strong></span></h1><p class=\"p2\">Right People Group is searching for experienced consultants for a major international transformation programme.</p><p class=\"p2\">We are looking for several senior specialists within Microsoft Dynamics 365, Azure, Data and Digital Transformation. The assignments are long-term and part of a large international programme.</p><p class=\"p2\">Availability is important, and we are currently prioritising consultants who are available immediately or within the next 4–8 weeks.</p><h3><span class=\"s1\"><strong>We are looking for:</strong></span></h3><p class=\"p3\"><strong>Dynamics 365</strong></p><ul><li data-list-item-id=\"e0fa1938b62404f5f30b8c68cf71deb SIEM-systemer (Mnemonic og lignende)</li><li style=\"tab-stops:list 36.0pt;\" data-list-item-id=\"e2ce84c5b44c9b62e69cfb3008441325e\">Administrasjon av Windows Event Log og Event Forwarding</li><li style=\"tab-stops:list 36.0pt;\" data-list-item-id=\"ec3b7ec82ca4879c9f6b8ec5c082c18b8\">Oppsett og administrasjon av Syslog-protokoll og servere (rsyslog, syslog-ng)</li><li style=\"tab-stops:list 36.0pt;\" data-list-item-id=\"e6e66d58ab9d4a2f447933e1abeb0a7f8\">Verifisering og feilsøking av logginfrastruktur</li><li style=\"tab-stops:list 36.0pt;\" data-list-item-id=\"ea4c7dc0c19f8358b039d95fa21b39df1\">Loggformattering, parsing og analyse</li><li style=\"tab-stops:list 36.0pt;\" data-list-item-id=\"e22da716288ca5e5bfc58631fb37b97ba\">Arbeid med Windows og Linux infrastruktur på tvers av tunnelanlegg og trafikksentraler</li></ul><p>&nbsp;</p><p><strong>Krav til kompetanse</strong></p><p><strong>Minimumskrav (obligatorisk):</strong></p><ul style=\"list-style-type:disc;\"><li style=\"tab-stops:list 36.0pt;\" data-list-item-id=\"eafdbd49464f778a80be1a640a8677ed6\">Mer enn 3 års erfaring som systemingeniør, driftsingeniør eller tilsvarende</li><li style=\"tab-stops:list 36.0pt;\" data-list-item-id=\"e87a481cc287bae87e1b2c6c0a6755831\">Kan sikkerhetsklareres til nivå Begrenset</li><li style=\"tab-stops:list 36.0pt;\" data-list-item-id=\"ec5b29174f0d3ae07bfe903239f87ad69\">Gode skriftlige og muntlige formidlingsevner på norsk</li></ul><p><strong>Krav til erfaring</strong></p><p><strong>Vi ser etter kandidater med:</strong></p><ul style=\"list-style-type:disc;\"><li style=\"tab-stops:list 36.0pt;\" data-list-item-id=\"e515beff49ff9f7b60e3ab0dc6ed4018c\">Mer enn 2 års erfaring med oppsett av logginfrastruktur (syslog-servere, lokal aggregering)</li><li style=\"tab-stops:list 36.0pt;\" data-list-item-id=\"e29e94afae8e90e27b52bf82d809e96f3\">Mer enn 2 års erfaring med konfigurasjon av loggkilder (servere, nettverksutstyr, kameraer, PLS)</li><li style=\"tab-stops:list 36.0pt;\" data-list-item-id=\"ec58d5847543ba72ba89847cc76c3bc6c\">God og relevant kompetanse på sikker videresending av logger til SIEM-systemer</li><li style=\"tab-stops:list 36.0pt;\" data-list-item-id=\"efb807f7f52754e7929d3ba23b1f2be45\">Mer enn 2 års erfaring med verifisering og feilsøking av logginfrastruktur</li><li style=\"tab-stops:list 36.0pt;\" data-list-item-id=\"eef6850f334af45797020800b958d134e\">Mer enn 2 års erfaring med Windows eller Linux infrastruktur</li><li style=\"tab-stops:list 36.0pt;\" data-list-item-id=\"e45b282e1815a7ff2c20c89d8d1539ce4\">Mer enn 2 års erfaring med Syslog-protokoll og servere (rsyslog, syslog-ng)</li><li style=\"tab-stops:list 36.0pt;\" data-list-item-id=\"e369afba44c28d39923d6bc22a82c9c00\">Mer enn 2 års erfaring med Windows Event Log og Event Forwarding</li><li style=\"tab-stops:list 36.0pt;\" data-list-item-id=\"e7f5896d4cd796ef90aa91401b4121952\">God kompetanse innen loggformater og parsing</li><li style=\"tab-stops:list 36.0pt;\" data-list-item-id=\"e1c25d5201a2e01485071ceaae49fd707\">Grunnleggende forståelse av OT-systemer og nettverksinfrastruktur</li><li style=\"tab-stops:list 36.0pt;\" data-list-item-id=\"eeb8ec7b81ea80215ac6878ea51591724\">Sterke samarbeidsevner og evne til å fungere godt i tverrfaglige team</li></ul><p><strong>Ønskelig:</strong>&nbsp;Erfaring med Mnemonic sine løsninger eller andre SIEM-systemer, erfaring med større organisasjoner eller offentlig sektor, erfaring med modernisering av digitale tjenester.</p><p style=\"-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(0, 0, 0);font-family:Lato, Tahoma, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:inherit;margin-bottom:20px;margin-top:20px;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;\">Send gjerne CV, tilgjengelighet, ønsket arbeidssted og timepris for aktuelle kandidater - til rune.rasen@rightpeoplegroup.com</p>","location":"Norway","languages":"Norwegian","competences":"IT operations and IT support","open":true},{"id":3523,"documentId":"eez654g596d5tloyjzukdba9","locale":"en","createdAt":"2026-08-14T09:35:24.945Z","updatedAt":"2026-08-14T09:35:24.945Z","publishedAt":"2026-08-14T09:35:24.935Z","title":"Konsulentforespørsel – Senior rådgiver innen sikkerhetsstyring og informasjonssikkerhet ","slug":"konsulentforesporsel-senior-radgiver-innen-sikkerhetsstyring-og-informasjonssikkerhet","description":"<p><br>For en kunde innen olje- og gassindustrien søker vi en erfaren konsulent som kan bidra til å strukturere og implementere virksomhetens arbeid med sikkerhet.</p><p><strong>Oppdraget</strong></p><p>Konsulenten skal sammenstille ulike krav knyttet til informasjonssikkerhet og øvrige sikkerhetsområder. Vedkommende skal bidra til å utarbeide en plan for hvordan krav, dokumentasjon og tilhørende informasjon skal struktureres, lagres og arkiveres i kundens systemer.</p><p>Arbeidet vil være en del av implementeringen av sikkerhet i virksomhetens styringssystem og omfatter blant annet:</p><ul style=\"list-style-type:disc;\"><li data-list-item-id=\"ea3b40a3f543e3ec0978faf052cb97767\">sikkerhetsstyring</li><li data-list-item-id=\"ec3c16a29b5fff964b25951ccc147dcb2\">fysisk sikkerhet</li><li data-list-item-id=\"e8b83f49ae9700cd6758b348ae6b752e5\">personellsikkerhet</li><li data-list-item-id=\"e98ef8bbe8b4b145eb4db7b93dfccdc3f\">informasjonssikkerhet</li><li data-list-item-id=\"e69a6eb80da78b50273f54895c04dc535\">cybersikkerhet</li><li data-list-item-id=\"e4311b8486abd928662971e21e6f1a7a8\">strukturering og dokumentasjon av relevante sikkerhetskrav</li><li data-list-item-id=\"e0e4c485588eae8b69978440d4f931ca9\">utarbeidelse og implementering av planer og prosesser</li></ul><p><strong>Ønsket kompetanse</strong></p><p>Vi ser etter en senior konsulent med:</p><ul style=\"list-style-type:disc;\"><li data-list-item-id=\"ee0eb6b728737947c08205e12289cb646\">erfaring med prosjektledelse, prosjektstyring eller koordinering</li><li data-list-item-id=\"ec39eac640348dd43d434fa23e7857faa\">god prosess- og virksomhetsforståelse</li><li data-list-item-id=\"e6987a902b7c875829a30d015357351ea\">erfaring med informasjonssikkerhet og sikkerhetsstyring</li><li data-list-item-id=\"e03589340ef82ff63c7d6f9843327fa65\">kunnskap om sikkerhetsloven og relevante regulatoriske krav</li><li data-list-item-id=\"e76e9e2968c22471921d328ea567574b2\">erfaring med styringssystemer, gjerne ISO 27001 eller tilsvarende</li><li data-list-item-id=\"ecf05d4ad7ecdd3123fa9e35427e596f6\">evne til å omsette krav og regelverk til praktiske prosesser og tiltak</li><li data-list-item-id=\"ef2e79f7669f575032c78d1502234c81e\">gode kommunikasjons- og samarbeidsevner</li><li data-list-item-id=\"e131671fe24a2308cf63a8dd915ca9408\">erfaring fra olje og gass, energi, forsvar eller annen sikkerhetskritisk virksomhet er en fordel</li></ul><p><strong>Praktisk informasjon</strong></p><ul style=\"list-style-type:disc;\"><li data-list-item-id=\"ed23dac3444adcbe64ae00a0180100432\">Varighet: 6–12 måneder, med mulighet for forlengelse</li><li data-list-item-id=\"e30a614ee42e077fb13bf59d41da6a4a8\">Omfang: 100 %</li><li data-list-item-id=\"e4feac2e1dca0bacb50da2a6deb111ff9\">Arbeidssted: Kundens lokaler i Bergen eller Sandefjord</li><li data-list-item-id=\"ed65c7cd193f844983bf75b2e31088bc9\">Språk: Flytende engelsk. Norsk er en fordel</li><li data-list-item-id=\"eccca1eca5972bc9897d604bb48832e8a\">Oppstart: Etter avtale</li></ul><p>Send gjerne CV, tilgjengelighet, ønsket arbeidssted og timepris for aktuelle kandidater - til rune.rasen@rightpeoplegroup.com</p>","location":"Norway","languages":"Norwegian","competences":"IT and management consulting","open":true},{"id":3563,"documentId":"r61gmzq8376fmhpycwpsq5fl","locale":"en","createdAt":"2026-09-29T10:30:02.258Z","updatedAt":"2026-09-29T10:30:02.258Z","publishedAt":"2026-09-29T10:30:02.249Z","title":"Consultant Task | Java Developers for Data Migration Project, Greater Copenhagen (29.09.2026)","slug":"consultant-task-java-developers-for-data-migration-project-greater-copenhagen-29-09-2026","description":"<p>On behalf of a private sector client, we are looking for experienced Java developers for a data migration project. The client is moving its personal insurance policies from a legacy core system to a new policy administration system. This is a one-off, batch-based migration covering a wide range of products.</p><p>The solution is a Java and Spring Boot application that extracts data from the source system, transforms and validates it, and loads it into the new platform. The work runs in monthly cycles, moving from segmentation and trial runs through business verification to production migration. The team is now expanding, and the consultant will join an established, well-structured codebase and help bring the migration to completion.</p><p>The team works in an agile setup with task management in Azure DevOps. The client is looking for a consultant who works well in a team, communicates clearly and is comfortable working independently.</p><p><strong>Location: </strong>Greater Copenhagen, onsite<br><strong>Workload: </strong>100%<br><strong>Start: </strong>01.11.2026 (01.12.2026 at the latest)<br><strong>Duration: </strong>Approx. 8 months, extension possible<br><strong>Language: </strong>English</p><p><strong>Your qualifications</strong><br>We are looking for a consultant with the following qualifications:<br>&nbsp;</p><ul><li data-list-item-id=\"e0a354fc46a04de4f48830f82a5e54922\">Solid experience with recent Java versions and Spring Boot</li><li data-list-item-id=\"e2fa23bc33e315316abc8f6abe4967791\">Experience with SQL and relational databases</li><li data-list-item-id=\"eb0312a94ca0714f6c07ce581054d69a3\">Experience with data migration, ETL and batch processing of large data volumes</li><li data-list-item-id=\"effd2723d4ee66d570318c4a4557e7095\">Experience with agile methods and task management in Azure DevOps, along with strong collaboration skills</li><li data-list-item-id=\"e5f23845d2fbe1dc73d80a55b60430f37\">Experience from the insurance industry is an advantage</li><li data-list-item-id=\"e91cc4a533bd0874425ea777da69daa33\">Knowledge of Gradle, Flyway, Databricks, structured logging, PowerShell and AI-assisted development tools is an advantage</li></ul><p><strong>Are you interested?</strong><br>If you have the right qualifications, please send your CV immediately to Mikkel Tegen at mtn+060@rightpeoplegroup.com.</p>","location":"Denmark","languages":"English","competences":"Software development","open":true}]}}}</script>
