<script type="application/ld+json">{"@context":"http://schema.org/","@type":"JobPosting","title":"Seniorrådgiver – HR Tech og digitalisering","description":"&lt;p&gt;&lt;span&gt;&lt;strong&gt;Lokasjon:&lt;/strong&gt; Oslo, Norge&lt;/span&gt;&lt;br&gt;&lt;span&gt;&lt;strong&gt;Arbeidsform:&lt;/strong&gt; On-site / hjemmekontor etter avtale&lt;/span&gt;&lt;br&gt;&lt;span&gt;&lt;strong&gt;Oppdragsperiode:&lt;/strong&gt; 1. oktober 2026 – 31. desember 2026&lt;/span&gt;&lt;br&gt;&lt;span&gt;&lt;strong&gt;Omfang:&lt;/strong&gt; Inntil 100 %&lt;/span&gt;&lt;br&gt;&lt;span&gt;&lt;strong&gt;Søknadsfrist:&lt;/strong&gt; 4. oktober 2026&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;h2&gt;&lt;span&gt;Oppdragsbeskrivelse&lt;/span&gt;&lt;/h2&gt;&lt;p&gt;&lt;span&gt;Klar for å forme fremtidens digitale HR gjennom teknologi, data og AI? Vi søker en seniorrådgiver som skal bidra til å utvikle og realisere en fremtidig tilnærming til HR-prosesser, HR-data og systemstøtte for kompetanse- og organisasjonsutvikling.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span&gt;Rollen kombinerer strategisk rådgivning med praktisk gjennomføring. Du vil fungere som sparringspartner for ledelsen og bidra til å koble HR-faglige behov med teknologiske muligheter, samtidig som du utvikler målbildet, prioriteringer og veikart for videre arbeid.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;h2&gt;&lt;span&gt;Ansvarsområder&lt;/span&gt;&lt;/h2&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Kartlegge dagens HR-prosesser, systemlandskap og brukerbehov.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Utarbeide målbilde for fremtidig HR Tech-arkitektur.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Vurdere hvordan teknologi kan understøtte kompetansestyring, strategisk bemanningsplanlegging, medarbeiderutvikling, læring og HR-analyse.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Identifisere gevinster, risikoer og prioriteringer.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Utarbeide veikart og gjennomføringsplan.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Rådgive om bruk av AI og automatisering i HR-prosesser.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Bidra til forankring av fremtidige løsninger og arbeidsmåter.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;h2&gt;&lt;span&gt;Krav&lt;/span&gt;&lt;/h2&gt;&lt;h3&gt;&lt;span&gt;Må ha&lt;/span&gt;&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Bachelor- eller mastergrad.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Dokumentert erfaring med HR Tech og digitalisering av HR-funksjoner.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Erfaring med HR-systemer som GAT, SAP, SuccessFactors, Oracle HCM, DFØ HR eller tilsvarende.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;God forståelse for samspillet mellom HR, IT, informasjonssikkerhet og virksomhetsstyring.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Erfaring med kompetansestyring, strategisk bemanningsplanlegging og medarbeiderutvikling.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Kompetanse innen HR-analyse og datadrevet beslutningsstøtte.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Erfaring med kunstig intelligens og automatisering i HR-prosesser.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Erfaring fra større endrings- eller transformasjonsprogrammer.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Norsk på morsmålsnivå.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;CV skal leveres på norsk.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;h3&gt;&lt;span&gt;Fordelaktig å ha&lt;/span&gt;&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Erfaring fra offentlig sektor.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Erfaring fra virksomheter med komplekse styrings- og regelverkskrav.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;h2&gt;&lt;span&gt;Om Sperton&lt;/span&gt;&lt;/h2&gt;&lt;p&gt;&lt;span&gt;Sperton er et globalt rekrutterings- og konsulentselskap med kontorer i Europa, Asia og Amerika. Vi hjelper organisasjoner med å finne og engasjere dyktige fagpersoner gjennom fleksible løsninger innen rekruttering, konsulenttjenester og global mobilitet.&lt;/span&gt;&lt;/p&gt;","identifier":{"@type":"PropertyValue","name":"Sperton Global AS ","value":"8474750"},"employmentType":"CONTRACTOR","validThrough":"2026-10-06 23:59:59 +0200","jobLocation":[{"@type":"Place","address":{"streetAddress":"0184","addressLocality":"Oslo","postalCode":"0184","addressCountry":"NO","addressRegion":"Norway","@type":"PostalAddress"}}]}</script>
